<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kopi Sederhana</title>
  <!-- Google Font: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* RESET & DASAR */
    
  </style>
</head>
<body>

  <!-- 1. NAVBAR (Satu box/bar horizontal) -->
  <header class="navbar">
    <!-- Sebelah Kiri: Nama Toko -->
    <a href="#" class="brand-logo">Kopi<span>Sederhana</span></a>

    <!-- Sebelah Kanan: Menu Navigasi -->
    <nav>
      <ul class="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#products">Products</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- 2. BODY / HERO SECTION (1 Halaman Layar) -->
  <main class="hero">
    <div class="hero-container">
      
      <!-- Sebelah Kiri: Headline, Deskripsi, Tombol -->
      <div class="hero-content">
        <h1 class="hero-title">Awali harimu dengan secangkir
        <span class="kopi">Kopi</span><span class="highlght">Sederhana</span> </h1>
        <p class="hero-desc">
          Selamat datang di Toko Sederhana! Kami menghadirkan produk berkualitas tinggi pilihan dengan harga terbaik dan pelayanan cepat langsung ke tangan Anda.
        </p>
        <div class="hero-actions">
          <a href="#pesan" class="btn-primary">Pesan Sekarang</a>
          <a href="#products" class="btn-secondary">Lihat Detail &darr;</a>
        </div>
      </div>

      <!-- Sebelah Kanan: Foto Produk -->
      <div class="hero-image-wrapper">
        <img 
          src="Bg Kopi.jpg" 
          alt="Foto Produk Unggulan" 
          class="product-img"
        />
      </div>

    </div>
  </main>

  <!-- Placeholder untuk section scroll menu produk (akan diisi di prompt berikutnya) -->
  <section class="product" id="products">
    <p>(Product Menu)</p>
    
  </section>

</body>
</html>
